name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # Valida wrangler.jsonc y el bundle del Worker sin desplegar ni usar credenciales.
      - name: Comprobar el Worker de Cloudflare
        run: npm run check:worker

      # Construir también el segundo cliente: el build estándar verifica Baltaretu.
      - name: Build de Creaciones Turia
        run: npm run build:turia
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Comprobar Worker de Creaciones Turia
        run: |
          node -e "const w=require('./dist/server/wrangler.json'); if(w.name!=='creacionesturia'||w.d1_databases?.[0]?.database_name!=='creacionesturia') process.exit(1)"

  accesibilidad:
    name: Accesibilidad y teclado (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas en navegador
        run: npm run test:e2e
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # Creaciones Turia (CLIENTE_ID=turia): solo panel, con su portafolio privado.
      - name: Pruebas en navegador de Creaciones Turia
        run: npm run test:e2e:turia
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Capturas reales del inicio de Turia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inicio-turia-responsive
          path: test-results/**/inicio-*.png
          if-no-files-found: warn

      - name: Capturas de revisión del catálogo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-catalogo-turia
          path: test-results/**/revision-catalogo-*.png
          if-no-files-found: warn

  equivalencia:
    name: Build desde D1 igual al actual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Importa el contenido a una D1 local, lo exporta como el build de producción y
      # compara páginas, sitemap y JSON-LD con el build desde los archivos.
      - name: Equivalencia del build desde D1
        run: npm run contenido:equivalencia
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
