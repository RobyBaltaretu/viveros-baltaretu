name: Importar contenido al panel

# Carga el contenido del repositorio (fichas, ajustes, páginas, proyectos, guías y fotos)
# en la base D1 de producción, a través del Worker publicado. Se lanza a mano desde
# Actions → "Importar contenido al panel" → Run workflow. Si algo no pasa la validación,
# no importa nada. El token va como secreto del repositorio (CONTENIDO_TOKEN), nunca en el código.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Dirección pública de la web (https://…workers.dev o tu dominio), sin barra final'
        required: true
        type: string

permissions:
  contents: read

jobs:
  importar:
    name: Importar contenido
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Importar
        run: npm run contenido:importar -- --url "$URL"
        env:
          URL: ${{ inputs.url }}
          CONTENIDO_TOKEN: ${{ secrets.CONTENIDO_TOKEN }}
