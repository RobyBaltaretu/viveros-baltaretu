# Textos de la portada. Se editan desde el panel (/keystatic → Portada).
# Los datos de la empresa que falten se quedan como [PLACEHOLDER] hasta que se confirmen.
titular:
  es: Planta ornamental al por mayor,
  en: Wholesale ornamental plants,
titularDestacado:
  es: desde Valencia a toda España.
  en: from Valencia to all of Spain.
entradilla:
  es: >-
    Palmeras, olivos, higueras y otras ornamentales de hasta 4 m para jardinerías, paisajistas y obra.
    Algunas especies también se venden por unidad y te las enviamos a casa.
  en: >-
    Palms, olive trees, fig trees and other ornamentals up to 4 m for garden centres, landscapers and
    contractors. Some species are also sold as single plants and delivered to your door.
familiasTitulo:
  es: Qué cultivamos
  en: What we grow
familiasTexto:
  es: Cuatro familias de planta mediterránea, de hasta 4 m de altura.
  en: Four families of Mediterranean plants, up to 4 m tall.
comprarTitulo:
  es: Dos formas de comprar
  en: Two ways to buy
mayorTitulo:
  es: Al por mayor
  en: Wholesale
mayorTexto:
  es: Para jardinerías, paisajistas, constructoras y ayuntamientos. Haz tu lista y te enviamos el presupuesto.
  en: For garden centres, landscapers, contractors and councils. Send us your list and we will quote you.
unidadTitulo:
  es: Por unidad
  en: Single plants
unidadTexto:
  es: Para tu casa o tu jardín. En las especies marcadas puedes pedir una sola planta y te la enviamos.
  en: For your home or garden. For the species marked, order just one plant and we will ship it to you.
pasosTitulo:
  es: Así de fácil
  en: As easy as this
pasos:
  - titulo:
      es: Elige tus plantas
      en: Choose your plants
    texto:
      es: Mira el catálogo y añade a tu lista las que necesitas.
      en: Browse the catalogue and add what you need to your list.
  - titulo:
      es: Pide presupuesto
      en: Ask for a quote
    texto:
      es: Envía la lista en un minuto o escríbenos por WhatsApp.
      en: Send the list in a minute or message us on WhatsApp.
  - titulo:
      es: Te lo llevamos
      en: We deliver
    texto:
      es: 'A tu obra, tu tienda o tu casa, en toda España. [PLACEHOLDER: plazos de entrega]'
      en: 'To your site, shop or home, anywhere in Spain. [PLACEHOLDER: delivery times]'
confianzaTitulo:
  es: Por qué Viveros Baltaretu
  en: Why Viveros Baltaretu
confianza:
  - icono: origen
    titulo:
      es: Origen de la planta
      en: Where our plants come from
    texto:
      es: '[PLACEHOLDER: procedencia de las plantas y cómo se cultivan]'
      en: '[PLACEHOLDER: where the plants come from and how they are grown]'
  - icono: documentacion
    titulo:
      es: Con su documentación
      en: Paperwork included
    texto:
      es: '[PLACEHOLDER: pasaporte fitosanitario y documentación que acompaña a cada envío]'
      en: '[PLACEHOLDER: plant passport and paperwork shipped with each order]'
  - icono: reparto
    titulo:
      es: Reparto a toda España
      en: Delivery across Spain
    texto:
      es: 'Desde la provincia de Valencia. [PLACEHOLDER: plazos y condiciones de reparto]'
      en: 'From the province of Valencia. [PLACEHOLDER: delivery times and conditions]'
mision:
  es: '[PLACEHOLDER: misión de la empresa]'
  en: '[PLACEHOLDER: company mission]'
vision:
  es: '[PLACEHOLDER: visión de la empresa]'
  en: '[PLACEHOLDER: company vision]'
llamadaTitulo:
  es: ¿Qué plantas necesitas?
  en: Which plants do you need?
llamadaTexto:
  es: Cuéntanos especies y cantidades, aunque sea una sola planta. Te respondemos con el presupuesto.
  en: Tell us the species and quantities, even if it is just one plant. We will get back to you with a quote.
