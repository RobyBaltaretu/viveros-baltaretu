slug: como-elegir-la-altura
titulo:
  es: Cómo elegir la altura de un ejemplar para tu proyecto
  en: How to choose the right specimen height for your project
resumen:
  es: Qué medir antes de pedir presupuesto para que el ejemplar encaje en el espacio y llegue sin problemas a la obra.
  en: What to measure before asking for a quote, so the specimen fits the space and reaches the site without trouble.
secciones:
  - titulo:
      es: Mide el espacio, no solo el hueco
      en: Measure the space, not just the planting hole
    texto:
      es: >-
        Ten en cuenta la altura libre (balcones, cables, aleros) y el ancho que ocupará la copa o las hojas cuando el ejemplar esté plantado.


        En la ficha de cada especie puedes ver su silueta junto a una persona de 1,8 m para hacerte una idea de la escala.
      en: >-
        Check the clear height (balconies, cables, eaves) and how wide the crown or fronds will be once the specimen is planted.


        Each species page shows its silhouette next to a 1.8 m person so you can get a feel for the scale.
  - titulo:
      es: Piensa en el acceso a la obra
      en: Think about site access
    texto:
      es: Los ejemplares grandes viajan en camión y suelen necesitar medios de descarga. Indica en tu petición si hay accesos estrechos, pendientes o límites de peso.
      en: Large specimens travel by truck and usually need lifting equipment. Mention narrow access, slopes or weight limits in your request.
  - titulo:
      es: Cuéntanos el uso
      en: Tell us what it is for
    texto:
      es: Una avenida, una rotonda o un jardín privado piden tamaños distintos. Con esa información te podemos proponer alternativas dentro del rango de alturas de cada especie.
      en: An avenue, a roundabout or a private garden each call for different sizes. With that information we can suggest options within each species' height range.
seoDescripcion:
  es: Qué medir antes de pedir un ejemplar de gran porte para tu obra.
  en: What to measure before ordering a large specimen for your project.
datosDeEjemplo: true
